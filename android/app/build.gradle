plugins {
    id 'com.android.application'
}

android {
    namespace 'site.lamafia.beybladex'
    compileSdk 35

    defaultConfig {
        applicationId 'site.lamafia.beybladex'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
